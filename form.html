<!DOCTYPE html>
<head>form</head>
<body>
    <h2>pendaftaran</h2>
    <form>
        <table>
            <tr>
                <td><label>nama lengkap</label></td>
                <td>:</td>
                <td><input type="text" required placeholder="masukkan nama"><br></td>
            </tr>
             <tr>
                <td><label>NIK</label></td>
                <td>:</td>
                <td><input type="number"><br></td>
             </tr>
             <tr>
                <td><label>email</label></td>
                <td>:</td>
                <td><input type="email"><br></td>
            </tr>
            <tr>
                <td><label>password</label></td>
                <td>:</td>
                <td><input type="password"><br></td>
            </tr>
            <tr>
                <td><label>tanggal lahir</label></td>
                <td>:</td>
                <td><input type="date"><br></td>
            </tr>
            <tr>
                <td><label>jenis kelamin</label></td>
                <td>:</td>
                <td><input type="radio" name="jenis kelamin">laki-laki<br>
                    <input type="radio" name="jenis kelamin">perempuan<br></td>
            </tr>
            <tr>
                <td><label>hobi</label></td>
                <td>:</td>
                <td><input type="checkbox" name="hobi" >nonton<br>
                <input type="checkbox" name="hobi" >basket<br>
                <input type="checkbox" name="hobi" >futsal<br>
                <input type="checkbox" name="hobi" >masak<br>
                <input type="checkbox" name="hobi" >liatin gweh<br></td>
            </tr>
            <tr>
                <td><label>alamat</label></td>
                <td>:</td>
                <td><textarea placeholder="masukkan alamat"></textarea><br></td>
            </tr>
            <tr>
                <td><label>jurusan</label></td>
                <td>:</td>
                <td><select name="jurusan">
                    <option value="tkj">tkj</option>
                    <option value="rpl">rpl</option>
                    <option value="pg">pg</option>
                </select></td>
            </tr>
            <tr>
                <td><label>upload foto</label></td>
                <td>:</td>
                <td><input type="file"><br></td>
            </tr>
        </table>

        <button type="submit">kirim</button>
    </form>
</body>
